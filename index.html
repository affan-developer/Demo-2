<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 30px;
        }
        main {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        h2 {
            color: #2c3e50;
        }
        .skills li {
            margin: 8px 0;
        }
        footer {
            text-align: center;
            padding: 15px;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Personal Profile</h1>
        <p>Welcome to my webpage!</p>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>Hello! I am a student who enjoys learning new things and exploring technology.</p>
        </section>

        <section>
            <h2>My Skills</h2>
            <ul class="skills">
                <li>HTML</li>
                <li>Python (Learning)</li>
                <li>Problem Solving</li>
            </ul>
        </section>

        <section>
            <h2>Contact</h2>
            <p>Email: example@email.com</p>
        </section>
    </main>


    <footer>
        <p>&copy; 2026 My Personal Profile</p>
    </footer>
</body>
</html>
